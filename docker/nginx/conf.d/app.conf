# Nginx Cấu hình Reverse Proxy & FastCGI

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:9000;
}

# 1. Domain Chính: shop.com (Next.js SSR & static assets & Laravel API)
server {
    listen 80;
    server_name shop.com localhost;
    client_max_body_size 120M;

    # Gzip nén dữ liệu tăng tốc độ tải trang
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets Next.js tối ưu cache trình duyệt
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Định tuyến /api về Laravel qua FastCGI PHP-FPM (chống lỗi 502 Bad Gateway)
    location /api {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Internal Laravel front-controller fallback for /api routes.
    location = /index.php {
        internal;
        root /var/www/backend/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_pass backend_upstream;
        fastcgi_read_timeout 300;
    }

    # Tất cả các route còn lại chuyển tiếp cho Next.js App Router
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Domain API độc lập: api.shop.com (Laravel 11 PHP-FPM)
server {
    listen 80;
    server_name api.shop.com;
    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 120M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
